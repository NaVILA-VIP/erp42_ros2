controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    wheel_effort:
      type: effort_controllers/JointGroupEffortController
    steering:
      type: position_controllers/JointGroupPositionController
    skid_drive:
      type: diff_drive_controller/DiffDriveController

wheel_effort:
  ros__parameters:
    joints: [right_front_wheel_joint, right_back_wheel_joint, left_front_wheel_joint, left_back_wheel_joint]

steering:
  ros__parameters:
    joints: [right_front_disk_wheel_joint, left_front_disk_wheel_joint]

skid_drive:
  ros__parameters:
    # Upstream names the wheels on +Y "right". ROS body coordinates use +Y for left.
    left_wheel_names: [right_front_wheel_joint, right_back_wheel_joint]
    right_wheel_names: [left_front_wheel_joint, left_back_wheel_joint]
    wheel_separation: 1.18
    wheel_radius: 0.28
    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    publish_rate: 20.0
    odom_frame_id: odom
    base_frame_id: structure
    enable_odom_tf: false
    tf_frame_prefix_enable: false
